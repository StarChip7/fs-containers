services:
  app:
    image: todo-frontend-dev
    volumes:
      - ./todo-frontend:/usr/src/app # The path can be relative, so ./ is enough to say "the same location as the docker-compose.yml"
      #- /usr/src/app/node_modules # keep image-installed node_modules (anonymous volume)
    environment:
      - VITE_BACKEND_URL=/api
    container_name: todo-frontend-dev # This will name the container todo-frontend-dev
    depends_on:
      - app-backend # wait for the backend container to be started
  debug-helper:
    image: busybox
  nginx:
    image: nginx:1.29
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    container_name: reverse-proxy
    depends_on:
      - app # wait for the frontend container to be started
  app-backend:
    image: todo-backend-dev
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://the_username:the_password@mongo:27017/the_database
    volumes:
      - ./todo-backend:/usr/src/app
      #- /usr/src/app/node_modules 
    container_name: todo-backend-dev # This will name the container todo-backend-dev
    depends_on:
      redis:
        condition: service_started # wait for the redis container to be started
      mongo:
        condition: service_started # wait for the mongo container to be started
  redis:
    image: redis
    command: ['redis-server', '--appendonly', 'yes'] # Enable data persistence
    volumes: # Declare the volume
      - ./redis_data:/data
  mongo:
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: the_database
    volumes:
      - ./todo-backend/mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
      - ./mongo_data:/data/db
  