services:
  app:
    image: todo-frontend
    container_name: todo-frontend
    depends_on:
      - app-backend # wait for the backend container to be started
  nginx:
    image: nginx:1.29
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    container_name: reverse-proxy
    depends_on:
      - app # wait for the frontend container to be started
  app-backend:
    image: todo-backend
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://the_username:the_password@mongo:27017/the_database
    container_name: todo-backend # This will name the container todo-backend
    depends_on:
      redis:
        condition: service_started # wait for the redis container to be started
      mongo:
        condition: service_started # wait for the mongo container to be started
  redis:
    image: redis
    command: ['redis-server', '--appendonly', 'yes'] # Enable data persistence
    volumes: # Declare the volume
      - ./redis_data:/data
  mongo:
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: the_database
    volumes:
      - ./todo-backend/mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
      - ./mongo_data:/data/db
  